<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="yarnGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="yarnGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <linearGradient id="yarnGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="4" />

  <!-- Measurement Scale (Left side) -->
  <line x1="100" y1="130" x2="100" y2="380" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="130" x2="116" y2="130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="180" x2="110" y2="180" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="230" x2="120" y2="230" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="280" x2="110" y2="280" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="330" x2="116" y2="330" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="380" x2="120" y2="380" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Top Bobbin Cap -->
  <rect x="190" y="116" width="132" height="18" rx="9" fill="#e2e8f0" opacity="0.9" />

  <!-- Yarn Coils / Spool Layers -->
  <!-- Top Section (Emerald) -->
  <rect x="176" y="142" width="160" height="22" rx="11" fill="url(#yarnGrad1)" />
  <rect x="171" y="172" width="170" height="22" rx="11" fill="url(#yarnGrad1)" />
  <rect x="166" y="202" width="180" height="22" rx="11" fill="url(#yarnGrad1)" />
  
  <!-- Middle Section (Cyan) -->
  <rect x="160" y="232" width="192" height="22" rx="11" fill="url(#yarnGrad2)" />
  <rect x="155" y="262" width="202" height="22" rx="11" fill="url(#yarnGrad2)" />
  <rect x="150" y="292" width="212" height="22" rx="11" fill="url(#yarnGrad2)" />

  <!-- Bottom Section (Indigo/Violet) -->
  <rect x="144" y="322" width="224" height="22" rx="11" fill="url(#yarnGrad3)" />
  <rect x="138" y="352" width="236" height="22" rx="11" fill="url(#yarnGrad3)" />

  <!-- Bottom Bobbin Base -->
  <rect x="124" y="382" width="264" height="20" rx="10" fill="#e2e8f0" opacity="0.9" />

  <!-- Flowing yarn thread with glow -->
  <path d="M 270,363 C 350,363 360,250 430,220" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 270,363 C 350,363 360,250 430,220" fill="none" stroke="#f0f9ff" stroke-width="3" stroke-linecap="round" />
  
  <!-- Caliper badge -->
  <circle cx="430" cy="220" r="8" fill="#38bdf8" />
  <circle cx="430" cy="220" r="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
</svg>
